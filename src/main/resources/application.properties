spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/automated_ict}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Fahim.1128@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}
server.servlet.session.timeout=4320m
spring.thymeleaf.cache=false


#cookie must match session timeout
server.servlet.session.cookie.max-age=259200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
spring.session.jdbc.initialize-schema=always

#connection pool(for free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=fahimmontasirtuhin1128@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true

#SSL Configuration(for 465)
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

#timeouts(so Render doesn't hang)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#disable StartTLS(not used for 465)
spring.mail.properties.mail.smtp.starttls.enable=false

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=fahimmontasirtuhin1128@gmail.com
