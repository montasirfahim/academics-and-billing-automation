<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Student</title>
    <link rel="stylesheet" th:href="@{/lib/bootstrap/css/bootstrap.min.css}">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f9f9f9;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        form {
            background: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            width: 100%;
            justify-content: center;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        button[type="submit"] {
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background: black;
        }

        input[type="hidden"] {
            display: none;
        }
    </style>

</head>
<body>
<div class="container justify-content-center mt-md-5">
    <div class="row justify-content-center">
        <div class="form-container col-12 col-md-10 col-lg-8">
            <form th:onsubmit="|editStudentCount(event, ${committee.committeeId})|">
                <div class="row mb-4">
                    <div class="col-12 text-center">
                        <h2 class="display-6">Update Student Count</h2>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-12 text-center">
                        <h4 class="text-secondary text-center" th:text="${committee.semester.semesterParity} + ' Semester, Session: '  + ${committee.session}"></h4>
                    </div>
                    <div class="col-12 text-center">
                        <h4 class="text-secondary text-center" th:text="'Held on: ' + ${committee.semester.semesterHeldYear} + ' ' + ${committee.semester.semesterHeldMonths}"></h4>
                    </div>
                </div>
                <div class="col-md-8 mx-auto">
                    <label for="student" class="form-label">Number of student</label>
                    <input id="student" type="number" required class="form-control">
                </div>

                <div class="row mt-4">
                    <div class="col-12 text-center">
                        <button type="submit">Update</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:inline="javascript">
    async function  editStudentCount(event, committeeId){
        event.preventDefault();
        const newValue = document.getElementById("student").value;
        if(!newValue || isNaN(newValue)){
            alert("Please provide valid integer number.")
            return;
        }
        try{
            const response = await fetch(`/api/committee/update-student`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({committeeId, newValue})
            });
            const data = await response.json();
            if(response.ok){
                alert("Student count has been updated successfully");
                window.location.href = `/committee/manage/${committeeId}`;
            }
            else{
                alert(data.message);
            }
        }catch (err){
            console.log(err);
            alert("An error occurred!");
        }
    }
</script>
</body>
</html>
