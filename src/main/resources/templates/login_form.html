<!DOCTYPE html>
<html lang="">
<head>
    <title>User Login</title>
    <script src="/js/auth.js"></script>
<!--    <link rel="stylesheet" th:href="@{/lib/bootstrap/css/bootstrap.min.css}">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/style/auth.css">
</head>
<body>
<form id="login-form" onsubmit="login(event)">
    <img src="/logo.PNG" alt="mbstu-logo" style="height:80px; width:80px">

    <h2>User Login</h2>
    <label for="email" class="form-label">Email:</label>
    <input id="email" name="email" type="email" class="form-control" placeholder="Enter your email"  required/>

    <label for="password" class="form-label">Password:</label>
    <input id="password" class="form-control" name="password" type="password" placeholder="Enter your password" required/>

    <button type="submit" id="login-btn" class="mb-2">Login</button>

    <p id="status" class="status mt-2"></p>
    <div class="text-center mt-2" id="forgot-div">
        <a href="javascript:void(0)" id="forgot-btn" onclick="forgotPasswordForm()" class="forgot-link">
            Forgot password?
        </a>
    </div>
    <div id="otp-form" class="m-auto">
        <label for="otp-field">OTP</label>
        <input type="number" id="otp-field" class="form-control mb-3">
        <button type="button" id="otp-submit-btn" onclick="validateOTP()">Verify</button>
    </div>
</form>

</body>
</html>
