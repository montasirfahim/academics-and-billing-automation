<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New TA/DA Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
        }

        .form-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .btn-submit {
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: black;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
            color: white;
        }

        label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }

        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="form-card">
                <header class="text-center mb-5">
                    <h2 class="fw-bold">Create New TA/DA Bill</h2>
                    <p class="text-muted">Please fill up all the travel details accurately</p>
                </header>

                <form th:action="@{/ta-da/new}" th:object="${taDaObj}" method="post">
                    <div class="row g-4">
                        <div class="col-12">
                            <label for="userId" class="form-label">Teacher / Staff Name</label>
                            <select id="userId" class="form-select form-select-lg" th:field="*{user}" required>
                                <option value="">--- Select Teacher ---</option>
                                <option th:each="user: ${users}"
                                        th:value="${user.userId}"
                                        th:text="${user.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="intention" class="form-label">Travel Intention</label>
                            <input id="intention" class="form-control" placeholder="e.g: Question Moderation Meeting" th:field="*{travelIntention}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="dtimefhu" class="form-label">Departure from His/Her University</label>
                            <input id="dtimefhu" type="datetime-local" class="form-control" th:field="*{departureTimeFromHisUniversity}" required/>
                        </div>

                        <div class="col-md-6">
                            <label for="atimeat" class="form-label">Arrival at Tangail (1st)</label>
                            <input id="atimeat" type="datetime-local" class="form-control" th:field="*{arrivalTimeAtTangail1}" required/>
                        </div>

                        <div class="col-md-6">
                            <label for="atimeam" class="form-label">Arrival at MBSTU</label>
                            <input id="atimeam" type="datetime-local" class="form-control" th:field="*{arrivalTimeAtMbstu}" required/>
                        </div>
                        <div class="col-12">
                            <hr>
                        </div>
                        <div class="col-md-6">
                            <label for="dtimefm" class="form-label">Departure from MBSTU</label>
                            <input id="dtimefm" type="datetime-local" class="form-control" th:field="*{departureTimeFromMbstu}" required/>
                        </div>

                        <div class="col-md-6">
                            <label for="atimeat2" class="form-label">Arrival at Tangail (2nd)</label>
                            <input id="atimeat2" type="datetime-local" class="form-control" th:field="*{arrivalTimeAtTangail2}" required/>
                        </div>

                        <div class="col-md-6">
                            <label for="atimeahu" class="form-label">Arrival back at His/Her University</label>
                            <input id="atimeahu" type="datetime-local" class="form-control" th:field="*{arrivalTimeAtHisUniversity}" required/>
                        </div>

                        <div class="col-md-6">
                            <label for="days" class="form-label">Total Days Spent</label>
                            <select id="days" class="form-select" th:field="*{totalDayCount}" required>
                                <option value="" selected disabled>--- Select Duration ---</option>
                                <option th:each="i : ${#numbers.sequence(1, 10)}" th:value="${i}" th:text="${i}"></option>
                            </select>
                        </div>

                        <div class="col-12 text-center mt-5">
                            <button type="submit" class="btn btn-submit btn-lg w-100">Create & Save Bill</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
