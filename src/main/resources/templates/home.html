        body {
            display: flex !important;
            flex-direction: column !important;

        a.basic-btn {
            display: inline-block;
            background: linear-gradient(to right, #ec77ab 0%, #7873f5 100%) !important;
            margin-bottom: 20px;
            border: none !important;
            color: white !important;
            text-decoration: none;
            padding: 10px 18px;
            width: 260px;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease !important;
            cursor: pointer;
        }

        a.basic-btn:hover {
            background: black !important;
            color: white !important;
        }

        .content-wrapper {
            flex: 0 0 auto;
            /*padding-top: 100px;*/
            min-height: 50% !important;
        }
        footer.footer-div{
            flex-grow: 1;

            flex-direction: column;
