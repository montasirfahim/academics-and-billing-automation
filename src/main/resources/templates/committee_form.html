<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exam Committee Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .form-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: auto;
            padding: 40px;
        }

        .btn-gradient {
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            transition: transform 0.2s, filter 0.2s;
        }

        .btn-gradient:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            color: white;
        }

        label {
            font-weight: bold;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        .add-new-link {
            text-decoration: none;
            font-size: 14px;
            color: #6366f1;
            transition: color 0.2s;
        }

        .add-new-link:hover {
            color: #4338ca;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="text-center mb-4 fw-bold">Create New Exam Committee</h2>

        <form th:action="@{/committee/new/{id}(id=${semester.semesterId})}" th:object="${committee}" method="post">

            <div class="mb-3">
                <label for="session" class="form-label">Session</label>
                <input id="session" type="text" class="form-control form-control-lg" placeholder="e.g: 2021-22" th:field="*{session}" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="year" class="form-label">Year</label>
                    <select id="year" class="form-select" th:field="*{semesterYearName}" required>
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="Msc">M.Sc</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="chairman" class="form-label">Committee Chairman</label>
                    <select id="chairman" class="form-select" th:field="*{chairman}" required>
                        <option value="">-- Select Chairman --</option>
                        <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.name}"></option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="internal1" class="form-label">Internal Member 1</label>
                    <select id="internal1" class="form-select" th:field="*{internalMember1}" required>
                        <option value="">-- Select Internal 1 --</option>
                        <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.name}"></option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="internal2" class="form-label">Internal Member 2</label>
                    <select id="internal2" class="form-select" th:field="*{internalMember2}" required>
                        <option value="">-- Select Internal 2 --</option>
                        <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.name}"></option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="external1" class="form-label">External Member 1</label>
                    <select id="external1" class="form-select" th:field="*{externalMember1}" required>
                        <option value="">-- Select External --</option>
                        <option th:each="u : ${externals}" th:value="${u.userId}" th:text="${u.name}"></option>
                    </select>
                </div>
                <div class="col-md-6 mb-4">
                    <label for="stu_count" class="form-label">Number of Students</label>
                    <input type="number" id="stu_count" class="form-control" th:field="*{studentCount}" placeholder="Enter number of students e.g: 55" required>
                </div>
            </div>

            <button type="submit" class="btn btn-gradient btn-lg w-100 fw-bold mb-3">Save Committee</button>

            <div class="text-center">
                <a href="/users/new" class="add-new-link">
                    <i class="bi bi-person-plus"></i> Add user if not found
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
