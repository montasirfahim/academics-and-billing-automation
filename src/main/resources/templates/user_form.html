<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f9f9f9;
            margin: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        form {
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            width: 1000px;
        }

        .form-row {
            display: flex;
            gap: 50px;
            margin-bottom: 10px;
        }

        .form-row > div {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        button[type="submit"] {
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            background: black;
        }

        input[type="hidden"] {
            display: none;
        }

        @media screen and (max-width: 800px) {
            form{
                width: 95%;
            }
            .form-row{
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
<form th:action="@{/users/new}" th:object="${user}" method="post">
    <h2>Register New User</h2>
    <input type="hidden" th:if="${user.userId} != null" th:field="*{userId}" />

    <div class="form-row">
        <div>
            <label for="name">Name:</label>
            <input id="name" class="form-control" type="text" placeholder="Enter name of the user" th:field="*{name}" required/>
        </div>
        <div>
            <label for="phone">Phone:</label>
            <input id="phone" class="form-control" type="text" placeholder="Enter phone number of the user" th:field="*{phone}" required/>
        </div>
    </div>

    <div class="form-row">
        <div>
            <label for="email">Email:</label>
            <input id="email" class="form-control" type="email" placeholder="Enter email of the user" th:field="*{email}" required/>
        </div>
        <div>
            <label for="password">Password:</label>
            <input id="password" class="form-control" type="password" placeholder="At least 6 characters" th:field="*{password}" required/>
        </div>

    </div>

    <div class="form-row">
        <div>
            <label for="university">University:</label>
            <input id="university" class="form-control" type="text" placeholder="e.g: MBSTU,Tangail" th:field="*{university}" required/>
        </div>
        <div>
            <label for="department">Department:</label>
            <input id="department" class="form-control" type="text" placeholder="e.g: ICT" th:field="*{department}" required/>
        </div>
    </div>

    <div class="form-row">
        <div>
            <label for="user_type">User Type:</label>
            <select id="user_type" class="form-select" th:field="*{userType}" required>
                <option value="">Select Type</option>
                <option value="faculty">Faculty</option>
                <option value="officer">Officer</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <label for="designation">Designation:</label>
            <select id="designation" class="form-select" th:field="*{designation}" required>
                <option value=""> Select Designation </option>
                <option value="Lecturer">Lecturer</option>
                <option value="Assistant Professor">Assistant Professor</option>
                <option value="Associate Professor">Associate Professor</option>
                <option value="Professor">Professor</option>
                <option value="Registrar">Registrar</option>
                <option value="Deputy Registrar">Deputy Registrar</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div>
            <label for="role">Role:</label>
            <select id="role" class="form-select" th:field="*{role}" required>
                <option value="">Select Role</option>
                <option value="admin">Admin</option>
                <option value="co-admin">Co-Admin</option>
                <option value="internal">Internal Teacher</option>
                <option value="external">External Teacher</option>
            </select>
        </div>
        <div>
            <label for="salaryGrade">Salary Grade:</label>
            <select id="salaryGrade" class="form-select" th:field="*{salaryGrade}" required>
                <option value="">Select Grade</option>
                <option th:each="i : ${#numbers.sequence(1, 20)}" th:value="'Grade ' + ${i}">Grade [[${i}]]</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div>
            <label for="gradingCategory">Grading Category:</label>
            <select id="gradingCategory" class="form-select" th:field="*{gradingCategory}" required>
                <option value="">Select Category</option>
                <option th:each="i : ${#numbers.sequence(1, 4)}" th:value="'Category ' + ${i}">Category [[${i}]]</option>
            </select>
        </div>
        <div>
            <label for="distance"> Distance(km) from MBSTU </label>
            <input id="distance" class="form-control" type="text" placeholder="e.g: 160 (only for external teacher" th:field="*{distanceFromMBSTU}">
        </div>
    </div>

    <button type="submit">Save</button>
</form>
</body>
</html>
